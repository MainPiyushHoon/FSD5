<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [11,22,32,41,5,62,72,81,9];
        let even = arr.filter(function(num){
            return num % 2 == 0;
        })

        let squre = even.map(function(num){
            return num * num;
        })

        let add = squre.reduce((num, sum) => (num + sum), 0);

        console.log("Sum of array is: ",add);
        
    </script>
</body>
</html>
